name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  LLAMA_CPP_VERSION: "b11157"
  LLAMA_CPP_CUDA: "12.4"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Download llama.cpp binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $llamaVersion = "${{ env.LLAMA_CPP_VERSION }}"
          $cudaVersion = "${{ env.LLAMA_CPP_CUDA }}"

          $url = "https://github.com/ggml-org/llama.cpp/releases/download/$llamaVersion/llama-$llamaVersion-bin-win-cuda-$cudaVersion-x64.zip"
          Write-Host "Downloading: $url"
          $zip = "$env:TEMP\llama-cpp.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $extract = "$env:TEMP\llama-cpp"
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          # Создаём папку binaries
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null

          # Копируем ВСЕ DLL (включая ggml-cpu-*, cudart, cublas и прочие зависимости)
          Copy-Item "$extract\*.dll" -Destination "src-tauri/binaries/" -Force

          # Копируем только llama-server.exe, остальные CLI-утилиты игнорируем
          Copy-Item "$extract\llama-server.exe" -Destination "src-tauri/binaries/" -Force

          # Переименовываем под target triple, который ожидает Tauri
          Rename-Item "src-tauri/binaries\llama-server.exe" -NewName "llama-server-x86_64-pc-windows-msvc.exe"

          # Отладка: что лежит в binaries
          Write-Host ""
          Write-Host "=== src-tauri/binaries ==="
          Get-ChildItem "src-tauri/binaries" | Format-Table Name, Length

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mixer ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
