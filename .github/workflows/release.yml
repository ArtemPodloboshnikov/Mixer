name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  LLAMA_CPP_VERSION: "b11157"
  LLAMA_CPP_CUDA: "12.4"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Download llama.cpp binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $llamaVersion = "${{ env.LLAMA_CPP_VERSION }}"
          $cudaVersion = "${{ env.LLAMA_CPP_CUDA }}"

          # ---- 1. Скачиваем основной архив ----
          $url = "https://github.com/ggml-org/llama.cpp/releases/download/$llamaVersion/llama-$llamaVersion-bin-win-$cudaVersion-x64.zip"
          Write-Host "Downloading: $url"
          $zip = "$env:TEMP\llama-cpp.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $extract = "$env:TEMP\llama-cpp"
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          # ---- 2. Создаём папку binaries ----
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null

          # ---- 3. Копируем только нужные файлы ----
          $needed = @(
            "llama.dll",
            "ggml.dll",
            "ggml-base.dll",
            "ggml-cuda.dll",
            "mtmd.dll"
          )

          foreach ($f in $needed) {
            $src = Join-Path $extract $f
            if (Test-Path $src) {
              Copy-Item $src -Destination "src-tauri/binaries/"
              Write-Host "  copied: $f"
            } else {
              Write-Host "  MISSING: $f"
            }
          }

          # Все ggml-cpu-*.dll — на случай разных процессоров
          Get-ChildItem "$extract\ggml-cpu-*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "src-tauri/binaries/"
            Write-Host "  copied: $($_.Name)"
          }

          # Если есть отдельный ggml-cpu.dll — копируем и его
          if (Test-Path "$extract\ggml-cpu.dll") {
            Copy-Item "$extract\ggml-cpu.dll" -Destination "src-tauri/binaries/"
            Write-Host "  copied: ggml-cpu.dll"
          }

          # ---- 4. Копируем llama-server и переименовываем под target triple ----
          $serverExe = Get-ChildItem "$extract\llama-server*.exe" | Select-Object -First 1
          if (-not $serverExe) {
            throw "llama-server.exe не найден в архиве"
          }
          Copy-Item $serverExe.FullName -Destination "src-tauri/binaries/llama-server-x86_64-pc-windows-msvc.exe"
          Write-Host "  copied llama-server as llama-server-x86_64-pc-windows-msvc.exe"

          # ---- 5. Отладка ----
          Write-Host ""
          Write-Host "=== src-tauri/binaries ==="
          Get-ChildItem "src-tauri/binaries" | Format-Table Name, Length

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mixer ${{ github.ref_name }}"
          releaseBody: "See the assets below for changes."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
